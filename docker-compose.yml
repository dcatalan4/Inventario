version: '3.8'

services:
  control-inventario:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - postgres
    networks:
      - control-inventario-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: control_inventario
      POSTGRES_USER: control_inventario_user
      POSTGRES_PASSWORD: control_inventario_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - control-inventario-network

volumes:
  postgres_data:

networks:
  control-inventario-network:
    driver: bridge
